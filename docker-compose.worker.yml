services:
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: mytube-extract-worker:latest
    container_name: mytube-extract-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      ASSET_RETENTION_DAYS: ${ASSET_RETENTION_DAYS:-7}
      WORKER_LOOP_INTERVAL_MS: ${WORKER_LOOP_INTERVAL_MS:-5000}
      WORKER_PROCESSING_TIMEOUT_MS: ${WORKER_PROCESSING_TIMEOUT_MS:-3600000}
      SUBTITLE_AUDIO_MAX_BYTES: ${SUBTITLE_AUDIO_MAX_BYTES:-536870912}
      WHISPER_CLI_PATH: ${WHISPER_CLI_PATH:-}
      WHISPER_MODEL_BASE_EN_PATH: ${WHISPER_MODEL_BASE_EN_PATH:-}
      WHISPER_MODEL_SMALL_EN_PATH: ${WHISPER_MODEL_SMALL_EN_PATH:-}
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
    volumes:
      - ${WHISPER_CPP_HOST_DIR:?Set WHISPER_CPP_HOST_DIR}:/whisper.cpp:ro
